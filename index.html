<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AHP Clinic — Procurement Checklist</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #161922;
    --surface-2: #1d212c;
    --border: #262b38;
    --text: #e7eaf0;
    --text-dim: #8b93a7;
    --accent: #6ea8ff;
    --accent-dim: #3a557a;
    --done: #4ade80;
    --warn: #f5b454;
    --critical: #f87171;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px 10px;
  }
  h1 { margin: 0; font-size: 18px; letter-spacing: -0.2px; }
  h1 .sub { color: var(--text-dim); font-weight: 400; font-size: 14px; margin-left: 8px; }
  .progress-wrap {
    margin-top: 10px;
    background: var(--surface-2);
    border-radius: 8px;
    height: 8px; overflow: hidden;
    position: relative;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--done));
    width: 0%;
    transition: width 0.3s ease;
  }
  .progress-text {
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-dim);
    display: flex; justify-content: space-between; align-items: center;
  }
  .progress-text .count { color: var(--text); font-variant-numeric: tabular-nums; }
  .sync-indicator { font-size: 11px; margin-left: 8px; color: var(--text-dim); }
  .sync-indicator.synced { color: var(--done); }
  .sync-indicator.syncing { color: var(--warn); }
  .sync-indicator.error { color: var(--critical); }
  .tabs {
    display: flex; gap: 6px; overflow-x: auto;
    padding: 10px 16px 8px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 78px; z-index: 9;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto;
    padding: 7px 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    border-radius: 16px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .tab:hover { color: var(--text); border-color: var(--accent-dim); }
  .tab.active {
    background: var(--accent);
    color: #0c1220;
    border-color: var(--accent);
    font-weight: 600;
  }
  main { padding: 12px 16px 100px; max-width: 760px; margin: 0 auto; }
  .phase-header {
    margin: 18px 0 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--accent);
    font-weight: 600;
  }
  .section-title {
    margin: 18px 0 8px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    border-left: 3px solid var(--accent-dim);
    padding-left: 10px;
  }
  .item {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    margin-bottom: 6px;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s, border-color 0.12s;
  }
  .item:hover { background: var(--surface-2); }
  .item.checked {
    background: rgba(74, 222, 128, 0.07);
    border-color: rgba(74, 222, 128, 0.3);
  }
  .item.checked .label { color: var(--text-dim); text-decoration: line-through; }
  .item.checked .qty { opacity: 0.5; }
  .item.critical:not(.checked) { border-left: 3px solid var(--critical); }
  .checkbox {
    flex: 0 0 auto;
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-radius: 5px;
    margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .item.checked .checkbox {
    background: var(--done);
    border-color: var(--done);
  }
  .item.checked .checkbox::after {
    content: "✓";
    color: #0c1220;
    font-weight: 700;
    font-size: 13px;
    line-height: 1;
  }
  .item-body { flex: 1; min-width: 0; }
  .label { font-size: 14px; color: var(--text); }
  .label .star { color: var(--critical); margin-left: 4px; font-size: 11px; }
  .label .moh {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 6px;
    background: rgba(74, 222, 128, 0.15);
    color: var(--done);
    border: 1px solid rgba(74, 222, 128, 0.4);
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    vertical-align: 2px;
  }
  .item.moh-required {
    border-left: 3px solid var(--done);
  }
  .item.moh-required.checked { border-left-color: rgba(74, 222, 128, 0.4); }
  .qty {
    display: inline-block;
    margin-left: 8px;
    padding: 2px 7px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 11px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .toolbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 10px 16px env(safe-area-inset-bottom);
    display: flex; gap: 8px;
    z-index: 11;
  }
  .toolbar button {
    flex: 1;
    padding: 11px 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .toolbar button:hover { background: var(--surface-2); }
  .toolbar button.danger { color: var(--critical); }
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-size: 14px;
  }
  .legend {
    margin: 0 0 12px;
    padding: 10px 12px;
    background: var(--surface-2);
    border-radius: 8px;
    font-size: 12px;
    color: var(--text-dim);
    border-left: 3px solid var(--accent);
  }
  .legend strong { color: var(--text); }
  .legend .star { color: var(--critical); margin: 0 2px; }
  @media (min-width: 720px) {
    .tabs { top: 78px; }
    h1 { font-size: 20px; }
    .item { padding: 12px 14px; }
    .label { font-size: 15px; }
  }
</style>
</head>

function slug(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60);
}
ITEMS.forEach((it) => { it.id = `${it.phase}-${slug(it.label)}`; });

let state = {};
let activeFilter = 'moh';

const $ = (id) => document.getElementById(id);

function setSync(text, kind) {
  const el = $('syncIndicator');
  el.textContent = text;
  el.className = 'sync-indicator ' + (kind || '');
}

async function loadFromSupabase() {
  setSync('syncing…', 'syncing');
  const { data, error } = await supa.from('clinic_checklist_checks').select('item_id');
  if (error) { setSync('offline', 'error'); console.error(error); return; }
  state = {};
  data.forEach(r => { state[r.item_id] = true; });
  setSync('synced', 'synced');
}

async function toggleItem(itemId) {
  const wasChecked = !!state[itemId];
  if (wasChecked) {
    delete state[itemId];
    renderAll();
    setSync('saving…', 'syncing');
    const { error } = await supa.from('clinic_checklist_checks').delete().eq('item_id', itemId);
    if (error) { setSync('error', 'error'); console.error(error); state[itemId] = true; renderAll(); return; }
  } else {
    state[itemId] = true;
    renderAll();
    setSync('saving…', 'syncing');
    const { error } = await supa.from('clinic_checklist_checks').upsert({
      item_id: itemId, checked_at: new Date().toISOString()
    });
    if (error) { setSync('error', 'error'); console.error(error); delete state[itemId]; renderAll(); return; }
  }
  setSync('synced', 'synced');
}

function subscribeRealtime() {
  supa.channel('clinic-checks')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'clinic_checklist_checks' }, (payload) => {
      if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
        state[payload.new.item_id] = true;
      } else if (payload.eventType === 'DELETE') {
        delete state[payload.old.item_id];
      }
      renderAll();
    })
    .subscribe();
}

function counts() { return { total: ITEMS.length, checked: ITEMS.filter(i => state[i.id]).length }; }
function phaseCounts(phase) {
  const items = ITEMS.filter(i => i.phase === phase);
  return { total: items.length, checked: items.filter(i => state[i.id]).length };
}

function renderProgress() {
  const { total, checked } = counts();
  const pct = total ? Math.round((checked / total) * 100) : 0;
  $('progressBar').style.width = pct + '%';
  $('progressCount').textContent = `${checked} / ${total}`;
  $('progressPct').textContent = pct + '%';
}

function renderTabs() {
  const phases = [
    { key: 'moh', label: 'MOH required' },
    { key: 'all', label: 'All' },
    { key: '0', label: 'Phase 0 (licensing)' },
    { key: '1', label: 'Phase 1' },
    { key: '2', label: 'Phase 2' },
    { key: '3', label: 'Phase 3' },
    { key: '4', label: 'Phase 4' },
    { key: '5', label: 'Phase 5' },
    { key: '6', label: 'Off-site' },
    { key: '7', label: 'Punch list' },
    { key: 'critical', label: '⭐ Critical' },
    { key: 'unchecked', label: 'Unchecked' },
  ];
  const tabs = $('tabs');
  tabs.innerHTML = '';
  phases.forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (activeFilter === p.key ? ' active' : '');
    let label = p.label;
    if (['0','1','2','3','4','5','6','7'].includes(p.key)) {
      const c = phaseCounts(p.key);
      label += ` (${c.checked}/${c.total})`;
    } else if (p.key === 'moh') {
      const items = ITEMS.filter(i => i.mohMandated);
      const checked = items.filter(i => state[i.id]).length;
      label += ` (${checked}/${items.length})`;
    }
    btn.textContent = label;
    btn.onclick = () => { activeFilter = p.key; renderAll(); };
    tabs.appendChild(btn);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderList() {
  const list = $('list');
  let visible = ITEMS;
  let bannerHtml = '';
  if (activeFilter === 'moh') {
    visible = ITEMS.filter(i => i.mohMandated);
    bannerHtml = `<div class="legend" style="border-left-color: var(--done); margin-bottom: 14px;">
      <strong style="color:var(--done)">MOH-required only</strong> · ${visible.length} items the regulator strictly requires (Phase 0 licensing + HCSA ELSM Annex A drugs &amp; equipment). Get these and you clear the inspection minimum.
    </div>`;
  }
  else if (activeFilter === 'critical') visible = ITEMS.filter(i => i.critical);
  else if (activeFilter === 'unchecked') visible = ITEMS.filter(i => !state[i.id]);
  else if (activeFilter !== 'all') visible = ITEMS.filter(i => i.phase === activeFilter);

  if (bannerHtml) list.innerHTML = bannerHtml;

  if (!visible.length) {
    list.innerHTML += '<div class="empty">Nothing here. Try another filter.</div>';
    return;
  }

  let lastPhase = null, lastSection = null;
  visible.forEach(it => {
    if (it.phase !== lastPhase) {
      const phaseObj = ITEMS.find(x => x.phase === it.phase && x.phaseLabel);
      if (phaseObj) {
        const ph = document.createElement('div');
        ph.className = 'phase-header';
        ph.textContent = phaseObj.phaseLabel;
        list.appendChild(ph);
      }
      lastPhase = it.phase;
      lastSection = null;
    }
    if (it.section !== lastSection) {
      const st = document.createElement('div');
      st.className = 'section-title';
      st.textContent = it.section;
      list.appendChild(st);
      lastSection = it.section;
    }
    const checked = !!state[it.id];
    const row = document.createElement('div');
    row.className = 'item' + (checked ? ' checked' : '') + (it.critical ? ' critical' : '') + (it.mohMandated ? ' moh-required' : '');
    row.innerHTML = `
      <div class="checkbox"></div>
      <div class="item-body">
        <span class="label">${escapeHtml(it.label)}${it.mohMandated ? '<span class="moh">MOH</span>' : ''}${it.critical ? '<span class="star">⭐</span>' : ''}</span>
        <span class="qty">${escapeHtml(it.qty)}</span>
      </div>
    `;
    row.onclick = () => toggleItem(it.id);
    list.appendChild(row);
  });
}

function renderAll() { renderProgress(); renderTabs(); renderList(); }

$('resetBtn').onclick = async () => {
  if (!confirm('Reset all ticks across all devices? This cannot be undone.')) return;
  setSync('resetting…', 'syncing');
  const { error } = await supa.from('clinic_checklist_checks').delete().neq('item_id', '');
  if (error) { setSync('error', 'error'); console.error(error); return; }
  state = {}; renderAll(); setSync('synced', 'synced');
};

$('exportBtn').onclick = () => {
  const { total, checked } = counts();
  const lines = [
    `# AHP Clinic Procurement — ${new Date().toISOString().slice(0,10)}`,
    `Progress: ${checked}/${total} (${Math.round(checked/total*100)}%)`,
    ''
  ];
  let lastPhase = null, lastSection = null;
  ITEMS.forEach(it => {
    if (it.phase !== lastPhase) {
      lines.push(''); lines.push('## ' + (it.phaseLabel || `Phase ${it.phase}`));
      lastPhase = it.phase; lastSection = null;
    }
    if (it.section !== lastSection) {
      lines.push(''); lines.push('### ' + it.section);
      lastSection = it.section;
    }
    const box = state[it.id] ? '[x]' : '[ ]';
    const star = it.critical ? ' ⭐' : '';
    lines.push(`- ${box} ${it.label} — ${it.qty}${star}`);
  });
  const blob = new Blob([lines.join('\n')], {type: 'text/markdown'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `ahp-checklist-${new Date().toISOString().slice(0,10)}.md`;
  a.click();
  URL.revokeObjectURL(url);
};

(async () => {
  renderAll();
  await loadFromSupabase();
  subscribeRealtime();
  renderAll();
})();
</script>
